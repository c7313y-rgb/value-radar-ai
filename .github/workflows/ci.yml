name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: テスト（標準ライブラリのみで動くこと自体が要件）
        run: python -m unittest discover -s tests -v
      - name: パイプラインのスモークテスト
        run: python -m engine.pipeline --date 2026-01-15 --no-write
